version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: interviewai-mongodb
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: interview_ai

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: interviewai-backend
    restart: unless-stopped
    ports:
      - '5000:5000'
    depends_on:
      - mongodb
    environment:
      PORT: 5000
      NODE_ENV: production
      MONGODB_URI: mongodb://mongodb:27017/interview_ai
      JWT_ACCESS_SECRET: production_access_secret_change_me_in_real_env_32chars
      JWT_REFRESH_SECRET: production_refresh_secret_change_me_in_real_env_32chars
      FRONTEND_URL: http://localhost:80
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: interviewai-frontend
    restart: unless-stopped
    ports:
      - '80:80'
    depends_on:
      - backend

volumes:
  mongo_data:
    driver: local
